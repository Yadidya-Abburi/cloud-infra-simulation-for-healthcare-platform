events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Custom logging format with upstream response time
    log_format main '{"time": "$time_iso8601", "client": "$remote_addr", '
                    '"request": "$request", "status": $status, '
                    '"body_bytes_sent": $body_bytes_sent, '
                    '"upstream_addr": "$upstream_addr", '
                    '"upstream_response_time": "$upstream_response_time"}';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Dynamic upstream pool for Blue-Green routing
    # This file is dynamically swapped or reloaded during blue-green deployment
    include /etc/nginx/conf.d/upstream.conf;

    server {
        listen 80;
        server_name localhost;

        # Health endpoint for Nginx itself
        location /nginx-health {
            access_log off;
            return 200 '{"status":"UP","role":"ingress"}';
            add_header Content-Type application/json;
        }

        # Route all application traffic to current active API upstream
        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
