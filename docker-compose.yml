networks:
  frontend-net:
    driver: bridge
    internal: false
  backend-net:
    driver: bridge
    internal: false

volumes:
  postgres_data:
    driver: local

services:
  # Ingress / Reverse Proxy (Only publicly exposed port 80/8080)
  nginx:
    image: nginx:1.25-alpine
    container_name: healthcare-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - frontend-net
    depends_on:
      api-blue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Relational Database (Internal Only)
  postgres:
    image: postgres:16-alpine
    container_name: healthcare-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Message Queue (Internal Only)
  redis:
    image: redis:7.2-alpine
    container_name: healthcare-redis
    restart: always
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Mock External EHR System (Internal Only)
  mock-ehr:
    build:
      context: ./services/mock-ehr
      dockerfile: Dockerfile
    container_name: healthcare-mock-ehr
    restart: always
    environment:
      EHR_MODE: ${EHR_MODE:-normal}
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Mock AI & Agent Inference Service (Internal Only)
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: healthcare-ai-service
    restart: always
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # API Service - Active Blue Instance (Bridges frontend and backend networks)
  api-blue:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: healthcare-api-blue
    restart: always
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
      APP_VERSION: ${APP_VERSION:-v1.0.0}
      DEPLOYMENT_COLOR: blue
    networks:
      - frontend-net
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Background Worker (Scalable, Internal Only)
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    restart: always
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      EHR_SERVICE_URL: ${EHR_SERVICE_URL}
      METRICS_PORT: 9100
    networks:
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-ehr:
        condition: service_healthy
